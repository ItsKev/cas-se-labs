<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1570 800" width="1570" height="800" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Zusammenspiel von Gerät, GitHub, Dev Container und Azure</title>
  <desc id="d">Das Kurs-Template wird zum eigenen Repo. Das Repo wird mit dem Dev Container synchronisiert, in dem docker compose lokale Test-Container startet. Vom Dev Container aus legt Terraform die Cloud-Ressourcen in Azure an. Der Browser bedient den Editor, die lokale Anwendung und die Anwendung in Azure.</desc>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b6b66"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6fdb"/>
    </marker>
  </defs>

  <rect width="1570" height="800" fill="#ffffff"/>

  <text x="30" y="40" font-size="26" font-weight="700" fill="#1f1f1d">Wie die Umgebung zusammenspielt</text>
  <text x="30" y="66" font-size="17" fill="#5f5f5a">Code entsteht im Dev Container, liegt in GitHub und gelangt per Terraform nach Azure. Blau = der Weg in die Cloud.</text>

  <!-- Lanes -->
  <rect x="30" y="110" width="240" height="530" rx="14" fill="#f3f3f1"/>
  <rect x="340" y="110" width="280" height="530" rx="14" fill="#f3f3f1"/>
  <rect x="710" y="110" width="380" height="530" rx="14" fill="#f3f3f1"/>
  <rect x="1200" y="110" width="290" height="530" rx="14" fill="#f3f3f1"/>
  <text x="46" y="138" font-size="18" font-weight="700" fill="#5f5f5a">Eigenes Gerät</text>
  <text x="356" y="138" font-size="18" font-weight="700" fill="#5f5f5a">GitHub</text>
  <text x="726" y="138" font-size="18" font-weight="700" fill="#5f5f5a">Dev Container</text>
  <text x="1216" y="138" font-size="18" font-weight="700" fill="#5f5f5a">Azure (Switzerland North)</text>

  <!-- Lane 1: Browser -->
  <rect x="50" y="380" width="200" height="80" rx="12" fill="#ffffff" stroke="#b5b5ad" stroke-width="2"/>
  <text x="150" y="414" font-size="19" font-weight="700" text-anchor="middle" fill="#1f1f1d">Browser</text>
  <text x="150" y="440" font-size="16" text-anchor="middle" fill="#5f5f5a">oder VS Code Desktop</text>

  <!-- Lane 2: Template and own repo -->
  <rect x="360" y="170" width="240" height="80" rx="12" fill="#ffffff" stroke="#b5b5ad" stroke-width="2"/>
  <text x="480" y="204" font-size="19" font-weight="700" text-anchor="middle" fill="#1f1f1d">Kurs-Template</text>
  <text x="480" y="230" font-size="16" text-anchor="middle" fill="#5f5f5a">cas-se-labs (HSLU)</text>

  <rect x="360" y="380" width="240" height="80" rx="12" fill="#dbe7f5" stroke="#2a6fdb" stroke-width="2.5"/>
  <text x="480" y="414" font-size="19" font-weight="700" text-anchor="middle" fill="#1f1f1d">Eigenes Repo</text>
  <text x="480" y="440" font-size="16" text-anchor="middle" fill="#5f5f5a">privat, aus dem Template</text>

  <line x1="480" y1="250" x2="480" y2="378" stroke="#6b6b66" stroke-width="2" marker-end="url(#g)"/>
  <text x="494" y="318" font-size="16" fill="#5f5f5a">Use this</text>
  <text x="494" y="338" font-size="16" fill="#5f5f5a">template</text>

  <!-- Lane 3: tools and compose -->
  <rect x="730" y="165" width="340" height="95" rx="12" fill="#ffffff" stroke="#b5b5ad" stroke-width="2"/>
  <text x="900" y="198" font-size="19" font-weight="700" text-anchor="middle" fill="#1f1f1d">Werkzeuge</text>
  <text x="900" y="224" font-size="16" text-anchor="middle" fill="#5f5f5a">.NET, Terraform,</text>
  <text x="900" y="244" font-size="16" text-anchor="middle" fill="#5f5f5a">Azure CLI, Docker</text>

  <line x1="900" y1="260" x2="900" y2="318" stroke="#6b6b66" stroke-width="2" marker-end="url(#g)"/>

  <rect x="730" y="320" width="340" height="230" rx="12" fill="#ffffff" stroke="#b5b5ad" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="746" y="348" font-size="17" font-weight="700" fill="#1f1f1d">docker compose</text>
  <text x="746" y="368" font-size="14" fill="#5f5f5a">lokale Test-Container, ohne Azure-Konto</text>

  <rect x="745" y="395" width="140" height="95" rx="10" fill="#ffffff" stroke="#b5b5ad" stroke-width="2"/>
  <text x="815" y="428" font-size="17" font-weight="700" text-anchor="middle" fill="#1f1f1d">Anwendung</text>
  <text x="815" y="452" font-size="15" text-anchor="middle" fill="#5f5f5a">Port 8080</text>

  <rect x="915" y="395" width="140" height="95" rx="10" fill="#ffffff" stroke="#b5b5ad" stroke-width="2"/>
  <text x="985" y="428" font-size="17" font-weight="700" text-anchor="middle" fill="#1f1f1d">Emulatoren</text>
  <text x="985" y="452" font-size="14" text-anchor="middle" fill="#5f5f5a">ersetzen</text>
  <text x="985" y="470" font-size="14" text-anchor="middle" fill="#5f5f5a">Cloud-Dienste</text>

  <line x1="885" y1="442" x2="913" y2="442" stroke="#6b6b66" stroke-width="2" marker-end="url(#g)"/>

  <!-- Lane 4: Azure (neutral: what exists is built in class) -->
  <rect x="1220" y="165" width="250" height="110" rx="12" fill="#ffffff" stroke="#b5b5ad" stroke-width="2"/>
  <text x="1345" y="203" font-size="19" font-weight="700" text-anchor="middle" fill="#1f1f1d">Cloud-Ressourcen</text>
  <text x="1345" y="230" font-size="16" text-anchor="middle" fill="#5f5f5a">werden im Unterricht</text>
  <text x="1345" y="250" font-size="16" text-anchor="middle" fill="#5f5f5a">mit Terraform angelegt</text>

  <rect x="1220" y="320" width="250" height="80" rx="12" fill="#ffffff" stroke="#b5b5ad" stroke-width="2"/>
  <text x="1345" y="354" font-size="19" font-weight="700" text-anchor="middle" fill="#1f1f1d">Anwendung in Azure</text>
  <text x="1345" y="380" font-size="16" text-anchor="middle" fill="#5f5f5a">erreichbar per HTTPS</text>

  <line x1="1345" y1="275" x2="1345" y2="318" stroke="#6b6b66" stroke-width="2" marker-end="url(#g)"/>
  <text x="1360" y="302" font-size="16" fill="#5f5f5a">betreiben</text>

  <!-- Repo <-> Dev Container -->
  <line x1="600" y1="420" x2="708" y2="420" stroke="#6b6b66" stroke-width="2" marker-start="url(#g)" marker-end="url(#g)"/>
  <text x="655" y="388" font-size="15" text-anchor="middle" fill="#5f5f5a">git pull,</text>
  <text x="655" y="406" font-size="15" text-anchor="middle" fill="#5f5f5a">git push</text>

  <!-- Dev Container -> Azure (blue) -->
  <line x1="1070" y1="212" x2="1218" y2="212" stroke="#2a6fdb" stroke-width="3" marker-end="url(#b)"/>
  <text x="1144" y="188" font-size="15" text-anchor="middle" fill="#2a6fdb">terraform apply</text>

  <!-- Browser connections: no crossings -->
  <!-- 1) Editor and terminal (outer path) -->
  <path d="M110,460 V750 H1000 V642" fill="none" stroke="#6b6b66" stroke-width="2" marker-end="url(#g)"/>
  <text x="560" y="741" font-size="16" text-anchor="middle" fill="#5f5f5a">Editor und Terminal (Codespace oder lokaler Dev Container)</text>

  <!-- 2) Local test of the app -->
  <path d="M190,460 V700 H815 V492" fill="none" stroke="#6b6b66" stroke-width="2" marker-end="url(#g)"/>
  <text x="500" y="691" font-size="16" text-anchor="middle" fill="#5f5f5a">localhost:8080 (im Codespace: weitergeleiteter Port)</text>

  <!-- 3) HTTPS to the deployed app (blue) -->
  <path d="M230,380 V88 H1530 V360 H1472" fill="none" stroke="#2a6fdb" stroke-width="3" marker-end="url(#b)"/>
  <text x="1230" y="80" font-size="16" text-anchor="middle" fill="#2a6fdb">HTTPS auf die URL der Anwendung in Azure</text>
</svg>
